[tool.poetry]
name = "medi-manager"
version = "0.1.0"
description = "Media management system with organization and user management"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "core"}, {include = "apps"}]

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.2.4"
djangorestframework = "^3.14.0"
djangorestframework-simplejwt = "^5.3.0"
psycopg2-binary = "^2.9.7"
celery = "^5.3.4"
redis = "^6.2.0"
django-cors-headers = "^4.3.1"
drf-yasg = "^1.21.7"
moviepy = "^2.2.1"
pillow = "^11.3.0"
python-decouple = "^3.8"
python-dotenv = "^1.1.1"
django-jazzmin = "^3.0.1"
django-sslserver = "^0.22"
gunicorn = "^21.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-django = "^4.7.0"
black = "^23.11.0"
ruff = "^0.1.6"
pre-commit = "^3.5.0"
mypy = "^1.7.1"
isort = "^5.12.0"
flake8 = "^6.1.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.3"
mkdocs-material = "^9.4.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"migrations/*" = ["E501", "F401"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
# Relax typing strictness for MVP stability
disallow_untyped_defs = false
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = false

[[tool.mypy.overrides]]
module = [
    "django.*",
    "celery.*",
    "moviepy.*",
    "PIL.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "apps.*.migrations.*",
    "apps.users.admin.*",
    "apps.organizations.admin",
    "apps.*.tests.*",
    "apps.*.test.*",
    "apps.users.test",
    "apps.organizations.test",
    "core.urls",
    "core.celery_app",
    "core.db_router",
    "manage",
]
ignore_errors = true
