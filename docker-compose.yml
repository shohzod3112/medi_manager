services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${SUPERUSER_DB_USER}
      - POSTGRES_PASSWORD=${SUPERUSER_DB_PASSWORD}
      - POSTGRES_DB=${SUPERUSER_DB_NAME}
    ports:
      - "5433:5432"
    container_name: media_manager_db
    restart: always

  web:
    build: .
    image: media_manager:latest
    command: python3 manage.py runsslserver --certificate ./localhost+2.pem --key ./localhost+2-key.pem 0.0.0.0:8000
    volumes:
      - ./frontend:/app/frontend
      - ./static:/app/static
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
      - DATABASE=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SUPERUSER_USERNAME=shoh
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
      - DJANGO_SUPERUSER_PASSWORD=SuperSecretP@ss123$
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    container_name: media_manager_web
    restart: always

  redis:
    image: redis:7-alpine
    container_name: media_manager_redis
    ports:
      - "6379:6379"
    restart: always

  celery_worker:
    image:  media_manager:latest
    command: celery -A core worker --loglevel=info
    volumes:
      - logs_volume:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    container_name: media_manager_celery_worker
    restart: always

  celery_beat:
    image: media_manager:latest
    command: celery -A core beat --loglevel=info
    volumes:
      - logs_volume:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    container_name: media_manager_celery_beat
    restart: always

volumes:
  logs_volume:
  postgres_data:
  static_volume:
  media_volume:
