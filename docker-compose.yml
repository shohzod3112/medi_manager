services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${SUPERUSER_DB_USER}
      - POSTGRES_PASSWORD=${SUPERUSER_DB_PASSWORD}
      - POSTGRES_DB=${SUPERUSER_DB_NAME}
    ports:
      - "5433:5432"
    container_name: media_manager_db
    restart: always

  web:
    build: .
#    privileged: true
    image: media_manager:latest
    command: python3 manage.py runserver 0.0.0.0:8000
    volumes:
      - ./static:/app/static
      - static_volume:/app/staticfiles
      - /opt/media-manager/media:/app/media
      - /opt/media-manager/logs:/app/logs
      - /opt/media-manager/licence:/opt/media-manager/licence
      - /etc/machine-id:/etc/machine-id:ro
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
      - DATABASE=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SUPERUSER_USERNAME=shoh
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
      - DJANGO_SUPERUSER_PASSWORD=SuperSecretP@ss123$
#    ports:
#      - "8000:8000"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    container_name: media_manager_web
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python3 manage.py check"]
      interval: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
      - ../frontend/dist:/frontend/dist
      - static_volume:/static
      - /opt/media-manager/media:/app/media
    depends_on:
      - web
    restart: always

  redis:
    image: redis:7-alpine
    container_name: media_manager_redis
    ports:
      - "6379:6379"
    restart: always

  celery_worker:
    image:  media_manager:latest
    command: celery -A core worker --loglevel=info
    volumes:
      - ./static:/app/static
      - static_volume:/app/staticfiles
      - /opt/media-manager/media:/app/media
      - /opt/media-manager/logs:/app/logs
      - /opt/media-manager/licence:/opt/media-manager/licence
      - /etc/machine-id:/etc/machine-id:ro
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    container_name: media_manager_celery_worker
    restart: always

  celery_beat:
    image: media_manager:latest
    command: celery -A core beat --loglevel=info
    volumes:
      - ./static:/app/static
      - static_volume:/app/staticfiles
      - /opt/media-manager/media:/app/media
      - /opt/media-manager/logs:/app/logs
      - /opt/media-manager/licence:/opt/media-manager/licence
      - /etc/machine-id:/etc/machine-id:ro
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    container_name: media_manager_celery_beat
    restart: always

volumes:
  logs_volume:
  postgres_data:
  static_volume:
  media_volume:
